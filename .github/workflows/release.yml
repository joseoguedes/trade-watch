name: Release

# Pushing a tag like v1.0.0 builds TradewatchSetup.exe (installer) and Tradewatch.exe (portable)
# and publishes both as a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tradewatch.Tests

      - name: Build
        run: dotnet publish Tradewatch/Tradewatch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" installer\Tradewatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer/Output/TradewatchSetup.exe publish/Tradewatch.exe --title "Tradewatch ${{ github.ref_name }}" --generate-notes
