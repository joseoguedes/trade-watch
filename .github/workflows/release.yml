name: Release

# Pushing a tag like v1.0.0 builds Tradewatch.exe and publishes it as a GitHub Release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Tradewatch.Tests

      - name: Build
        run: dotnet publish Tradewatch/Tradewatch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/Tradewatch.exe --title "Tradewatch ${{ github.ref_name }}" --generate-notes
